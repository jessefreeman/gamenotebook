name: Tag Release Builds

on:
  push:
    branches-ignore:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.release_meta.outputs.channel }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate release tag format
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-dev\.[0-9]+)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is invalid. Use v<major>.<minor>[.<patch>] or v<major>.<minor>[.<patch>]-dev.<n>."
            exit 1
          fi

      - name: Derive release channel
        id: release_meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ -dev\.[0-9]+$ ]]; then
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate tag commit is on main branch history
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "::error::Release tags must point to a commit that is on origin/main history."
            exit 1
          fi

      - name: Sync app versions from tag
        run: node scripts/sync-version-from-tag.cjs --tag ${{ github.ref_name }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Key Vault reachability for updater signing
        env:
          AZURE_KEYVAULT_NAME: ${{ vars.AZURE_KEYVAULT_NAME }}
          PREFLIGHT_ENV_FILE: ${{ runner.temp }}/preflight-keyvault.env
        run: |
          rm -f "$PREFLIGHT_ENV_FILE"
          node scripts/fetch-signing-secrets-from-azure.cjs \
            --keyvault "$AZURE_KEYVAULT_NAME" \
            --secrets "TAURI_PRIVATE_KEY=tauri-private-key" \
            --env-file "$PREFLIGHT_ENV_FILE"
          if [[ ! -s "$PREFLIGHT_ENV_FILE" ]]; then
            echo "::error::Unable to fetch updater signing secret from Azure Key Vault."
            exit 1
          fi

      - name: Validate release workflow invariants
        run: node scripts/check-tag-release-workflow.cjs --strict

  build:
    name: Build (${{ matrix.platform.name }})
    needs: preflight
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/gamenotebook-release-target-${{ matrix.platform.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync app versions from tag
        run: node scripts/sync-version-from-tag.cjs --tag ${{ github.ref_name }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 7.33.7
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Fetch updater signing secrets from Azure Key Vault
        env:
          AZURE_KEYVAULT_NAME: ${{ vars.AZURE_KEYVAULT_NAME }}
          KEYVAULT_ENV_FILE: ${{ runner.temp }}/release-secrets.env
        shell: bash
        run: |
          rm -f "$KEYVAULT_ENV_FILE"
          node scripts/fetch-signing-secrets-from-azure.cjs \
            --keyvault "$AZURE_KEYVAULT_NAME" \
            --secrets "TAURI_PRIVATE_KEY=tauri-private-key,TAURI_KEY_PASSWORD?=tauri-key-password" \
            --env-file "$KEYVAULT_ENV_FILE"
          cat "$KEYVAULT_ENV_FILE" >> "$GITHUB_ENV"

      - name: Fetch macOS signing/notarization secrets from Azure Key Vault
        if: matrix.platform.name == 'macos'
        env:
          AZURE_KEYVAULT_NAME: ${{ vars.AZURE_KEYVAULT_NAME }}
          KEYVAULT_ENV_FILE: ${{ runner.temp }}/macos-secrets.env
        shell: bash
        run: |
          rm -f "$KEYVAULT_ENV_FILE"
          node scripts/fetch-signing-secrets-from-azure.cjs \
            --keyvault "$AZURE_KEYVAULT_NAME" \
            --secrets "APPLE_DEV_ID_P12_BASE64=apple-dev-id-p12-base64,APPLE_DEV_ID_P12_PASSWORD=apple-dev-id-p12-password,APPLE_SIGNING_IDENTITY=apple-signing-identity,APPLE_TEAM_ID?=apple-team-id,APPLE_API_KEY_ID=apple-api-key-id,APPLE_API_ISSUER_ID=apple-api-issuer-id,APPLE_API_PRIVATE_KEY_P8_BASE64=apple-api-private-key-p8-base64" \
            --env-file "$KEYVAULT_ENV_FILE"
          cat "$KEYVAULT_ENV_FILE" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev librsvg2-dev patchelf
          sudo apt-get install -y libwebkit2gtk-4.0-dev || sudo apt-get install -y libwebkit2gtk-4.1-dev
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple Developer ID certificate
        if: matrix.platform.name == 'macos'
        shell: bash
        run: |
          CERT_PATH="$RUNNER_TEMP/apple-dev-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/gamenotebook-signing.keychain-db"

          node -e "const fs=require('fs');fs.writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_DEV_ID_P12_BASE64, 'base64'))" "$CERT_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_DEV_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "MACOS_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build and package release artifacts
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_CHANNEL: ${{ needs.preflight.outputs.channel }}
          ENABLE_UPDATER_ARTIFACTS: "1"
        run: pnpm build:release -- --platform ${{ matrix.platform.name }}

      - name: Notarize and verify macOS artifacts
        if: matrix.platform.name == 'macos'
        shell: bash
        run: |
          APP_PATH="$(find "$CARGO_TARGET_DIR/release/bundle/macos" -maxdepth 1 -name "*.app" -print -quit)"
          DMG_PATH="$(find release-files -maxdepth 1 -name "*_macos.dmg" -print -quit)"
          if [[ -z "$APP_PATH" || -z "$DMG_PATH" ]]; then
            echo "::error::Unable to locate macOS app or DMG for notarization."
            exit 1
          fi
          node scripts/macos-notarize-and-verify.cjs \
            --app "$APP_PATH" \
            --dmg "$DMG_PATH" \
            --report "release-files/macos-signing-report.json"

      - name: Trusted sign Windows artifacts (Azure Trusted Signing)
        if: matrix.platform.name == 'windows'
        uses: azure/trusted-signing-action@v0.5.9
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\release-files
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Windows Authenticode signatures
        if: matrix.platform.name == 'windows'
        shell: pwsh
        run: |
          ./scripts/windows-verify-signatures.ps1 -Dir release-files -ReportPath release-files/windows-signing-report.json

      - name: Verify release artifacts (signed platforms)
        if: matrix.platform.name != 'linux'
        run: node scripts/check-release-artifacts.cjs --dir release-files --platform ${{ matrix.platform.name }} --require-updater --require-os-signatures

      - name: Verify release artifacts (linux)
        if: matrix.platform.name == 'linux'
        run: node scripts/check-release-artifacts.cjs --dir release-files --platform ${{ matrix.platform.name }} --require-updater

      - name: Cleanup macOS signing keychain
        if: always() && matrix.platform.name == 'macos'
        shell: bash
        run: |
          if [[ -n "${MACOS_SIGNING_KEYCHAIN:-}" && -f "${MACOS_SIGNING_KEYCHAIN}" ]]; then
            security delete-keychain "${MACOS_SIGNING_KEYCHAIN}" || true
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform.name }}
          path: release-files/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    if: needs.preflight.result == 'success' && needs.build.result == 'success'
    needs:
      - preflight
      - build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate updater manifest
        run: |
          mkdir -p release-artifacts/stable release-artifacts/dev
          if [ "${{ needs.preflight.outputs.channel }}" = "dev" ]; then
            node scripts/generate-updater-manifest.cjs \
              --artifacts-dir release-artifacts \
              --repo ${{ github.repository }} \
              --version ${{ github.ref_name }} \
              --notes "Dev channel release ${{ github.ref_name }}" \
              --output release-artifacts/dev-latest.json \
              --require-artifacts
            cp release-artifacts/dev-latest.json release-artifacts/dev/latest.json
            node scripts/validate-updater-manifest.cjs --manifest release-artifacts/dev-latest.json
          else
            node scripts/generate-updater-manifest.cjs \
              --artifacts-dir release-artifacts \
              --repo ${{ github.repository }} \
              --version ${{ github.ref_name }} \
              --notes "Stable channel release ${{ github.ref_name }}" \
              --output release-artifacts/stable-latest.json \
              --require-artifacts
            cp release-artifacts/stable-latest.json release-artifacts/latest.json
            cp release-artifacts/stable-latest.json release-artifacts/stable/latest.json
            node scripts/validate-updater-manifest.cjs --manifest release-artifacts/stable-latest.json
          fi

      - name: Attach artifacts to tag release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/*
            release-artifacts/stable/*
            release-artifacts/dev/*
          fail_on_unmatched_files: false
          overwrite_files: true

  smoke:
    name: Release smoke checks
    runs-on: ubuntu-latest
    needs:
      - preflight
      - release
    if: needs.release.result == 'success'

    steps:
      - name: Verify manifest assets are downloadable
        shell: bash
        run: |
          if [ "${{ needs.preflight.outputs.channel }}" = "dev" ]; then
            assets=("dev-latest.json")
          else
            assets=("stable-latest.json" "latest.json")
          fi
          for asset in "${assets[@]}"; do
            url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${asset}"
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$url")
            if [ "$code" != "200" ]; then
              echo "::error::Asset not reachable: $url (HTTP $code)"
              exit 1
            fi
            echo "Verified: $url"
          done

      - name: Verify signing report assets are downloadable
        shell: bash
        run: |
          for asset in macos-signing-report.json windows-signing-report.json; do
            url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${asset}"
            code=$(curl -sS -o "/tmp/$asset" -w "%{http_code}" "$url")
            if [ "$code" != "200" ]; then
              echo "::error::Signing report not reachable: $url (HTTP $code)"
              exit 1
            fi
            echo "Verified: $url"
          done

      - name: Validate signing reports
        run: |
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/macos-signing-report.json','utf8'));if(!r.passed||!r.checks||!r.checks.stapled){throw new Error('macOS signing report failed checks')};console.log('macOS signing report OK')"
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/windows-signing-report.json','utf8'));if(!r.passed||!Array.isArray(r.files)||r.files.length===0||r.files.some((f)=>String(f.status).toLowerCase()!=='valid')){throw new Error('Windows signing report failed checks')};console.log('Windows signing report OK')"
